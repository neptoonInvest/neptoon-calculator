name: NW-111 Daily Market History

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nw111-market-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch daily closing prices
        env:
          EODHD_TOKEN: ${{ secrets.EODHD_TOKEN }}
        run: python scripts/update_market_history.py

      - name: Commit cache
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market_history_3y.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update NW-111 daily market history'
            git push
          fi
